<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @font-face {
      font-family: 'Pretendard';
      src: url('file:///tmp/fonts/Pretendard-Regular.otf') format('opentype');
      font-weight: 400;
    }
    @font-face {
      font-family: 'Pretendard';
      src: url('file:///tmp/fonts/Pretendard-SemiBold.otf') format('opentype');
      font-weight: 600;
    }
    @font-face {
      font-family: 'Pretendard';
      src: url('file:///tmp/fonts/Pretendard-Bold.otf') format('opentype');
      font-weight: 700;
    }
    @font-face {
      font-family: 'Pretendard';
      src: url('file:///tmp/fonts/Pretendard-ExtraBold.otf') format('opentype');
      font-weight: 800;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1932px; height: 828px; }
    body {
      font-family: 'Pretendard', sans-serif;
      overflow: hidden;
      background: linear-gradient(135deg, #A8C8EF 0%, #6E9BD6 100%);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
    }

    .container {
      width: 1932px;
      height: 828px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 160px;
    }

    /* 배경 장식 원 */
    .bg-circle { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.10); }
    .bg-c1 { width: 620px; height: 620px; top: -200px; right: 520px; }
    .bg-c2 { width: 420px; height: 420px; bottom: -160px; right: 300px; }
    .bg-c3 { width: 260px; height: 260px; top: 90px; left: 480px; }

    /* 왼쪽 텍스트 */
    .text-area { display: flex; flex-direction: column; gap: 36px; z-index: 1; }

    .badge {
      display: inline-flex; align-items: center;
      background: rgba(255,255,255,0.22);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 100px; padding: 14px 36px; width: fit-content;
    }
    .badge-text { font-size: 30px; font-weight: 600; color: #FFFFFF; }

    .title {
      font-size: 150px; font-weight: 800; color: #FFFFFF;
      line-height: 1.0; letter-spacing: -5px;
      text-shadow: 0 4px 24px rgba(40,70,120,0.28);
    }

    .subtitle {
      font-size: 46px; font-weight: 600; color: rgba(255,255,255,0.96);
      line-height: 1.45; letter-spacing: -0.5px;
      text-shadow: 0 2px 12px rgba(40,70,120,0.20);
    }

    /* 오른쪽 폰 목업 */
    .mockup-area { z-index: 1; flex-shrink: 0; }
    .phone-frame {
      width: 392px; height: 760px;
      background: #1A1A1A; border-radius: 56px; padding: 14px;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.18), 0 40px 90px rgba(30,50,90,0.40);
      position: relative;
    }
    .phone-notch {
      position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
      width: 108px; height: 30px; background: #1A1A1A; border-radius: 16px; z-index: 10;
    }
    .phone-screen {
      width: 100%; height: 100%; background: #F5F5F4;
      border-radius: 44px; overflow: hidden; display: flex; flex-direction: column;
    }

    /* 앱 헤더 */
    .app-header {
      background: #FFFFFF; border-bottom: 1px solid #EAEAEA;
      padding: 50px 22px 16px; display: flex; align-items: center; justify-content: space-between;
    }
    .app-header .h1 { font-size: 24px; font-weight: 700; color: #1A1A1A; }
    .app-header .add {
      background: #1A1A1A; color: #FFFFFF; font-size: 16px; font-weight: 600;
      padding: 9px 16px;
    }

    /* 월 바 */
    .month-bar {
      background: #FFFFFF; border-bottom: 1px solid #EAEAEA;
      padding: 14px 22px; display: flex; align-items: center; justify-content: space-between;
    }
    .month-bar .label { font-size: 21px; font-weight: 600; color: #1A1A1A; }
    .month-bar .nav { font-size: 22px; color: #8A8A8E; }

    /* 요일 */
    .weekdays { display: grid; grid-template-columns: repeat(7,1fr); background: #FFFFFF; border-bottom: 1px solid #EAEAEA; }
    .weekdays > div { text-align: center; padding: 10px 0; font-size: 15px; color: #8A8A8E; font-weight: 600; }
    .weekdays > div.sun { color: #F04452; }

    /* 그리드 */
    .grid { display: grid; grid-template-columns: repeat(7,1fr); grid-auto-rows: 1fr; background: #EAEAEA; gap: 1px; flex: 1; }
    .cell { background: #FFFFFF; padding: 8px 4px 0; display: flex; flex-direction: column; gap: 4px; }
    .cell.out { background: #F5F5F4; }
    .num { font-size: 15px; font-weight: 500; color: #1A1A1A; }
    .cell.out .num { color: #B5B5B8; }
    .cell.sun .num { color: #F04452; }
    .num.today {
      align-self: flex-start; color: #FFFFFF; background: #1A1A1A;
      width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; font-weight: 600;
    }
    .pill { font-size: 12px; line-height: 1.25; padding: 2px 5px; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pill.blue { background: #A8C8EF; color: #1A1A1A; font-weight: 600; }
    .pill.ink { background: #1A1A1A; }
  </style>
</head>
<body>
  <div class="container">
    <div class="bg-circle bg-c1"></div>
    <div class="bg-circle bg-c2"></div>
    <div class="bg-circle bg-c3"></div>

    <div class="text-area">
      <div class="badge"><span class="badge-text">토스 미니앱</span></div>
      <div class="title">Do &amp; Done</div>
      <div class="subtitle">한 일도, 할 일도 · 카테고리별로<br>한곳에서 정리하는 캘린더</div>
    </div>

    <div class="mockup-area">
      <div class="phone-frame">
        <div class="phone-notch"></div>
        <div class="phone-screen">
          <div class="app-header">
            <div class="h1">Do &amp; Done</div>
            <div class="add">추가</div>
          </div>
          <div class="month-bar">
            <span class="nav">‹</span>
            <span class="label">2026년 6월</span>
            <span class="nav">›</span>
          </div>
          <div class="weekdays">
            <div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
          </div>
          <div class="grid">
            <!-- week 1 -->
            <div class="cell sun"><span class="num">31</span></div>
            <div class="cell"><span class="num">1</span><span class="pill ink">팀 회의</span></div>
            <div class="cell"><span class="num">2</span></div>
            <div class="cell"><span class="num">3</span><span class="pill blue">운동</span></div>
            <div class="cell"><span class="num">4</span></div>
            <div class="cell"><span class="num">5</span><span class="pill ink">마감</span></div>
            <div class="cell"><span class="num">6</span></div>
            <!-- week 2 -->
            <div class="cell sun"><span class="num">7</span><span class="pill blue">브런치</span></div>
            <div class="cell"><span class="num">8</span></div>
            <div class="cell"><span class="num">9</span><span class="pill ink">리뷰</span></div>
            <div class="cell"><span class="num">10</span></div>
            <div class="cell"><span class="num">11</span><span class="pill blue">운동</span></div>
            <div class="cell"><span class="num">12</span></div>
            <div class="cell"><span class="num">13</span></div>
            <!-- week 3 -->
            <div class="cell sun"><span class="num">14</span></div>
            <div class="cell"><span class="num">15</span><span class="pill ink">출장</span></div>
            <div class="cell"><span class="num">16</span></div>
            <div class="cell"><span class="num today">17</span><span class="pill blue">약속</span></div>
            <div class="cell"><span class="num">18</span></div>
            <div class="cell"><span class="num">19</span></div>
            <div class="cell"><span class="num">20</span><span class="pill ink">정산</span></div>
            <!-- week 4 -->
            <div class="cell sun"><span class="num">21</span></div>
            <div class="cell"><span class="num">22</span></div>
            <div class="cell"><span class="num">23</span><span class="pill blue">운동</span></div>
            <div class="cell"><span class="num">24</span></div>
            <div class="cell"><span class="num">25</span><span class="pill ink">기념일</span></div>
            <div class="cell"><span class="num">26</span></div>
            <div class="cell"><span class="num">27</span></div>
            <!-- week 5 -->
            <div class="cell sun"><span class="num">28</span></div>
            <div class="cell"><span class="num">29</span></div>
            <div class="cell"><span class="num">30</span><span class="pill blue">회고</span></div>
            <div class="cell out"><span class="num">1</span></div>
            <div class="cell out"><span class="num">2</span></div>
            <div class="cell out"><span class="num">3</span></div>
            <div class="cell out"><span class="num">4</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
