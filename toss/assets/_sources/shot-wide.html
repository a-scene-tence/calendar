<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @font-face { font-family:'Pretendard'; src:url('file:///tmp/fonts/Pretendard-Regular.otf') format('opentype'); font-weight:400; }
    @font-face { font-family:'Pretendard'; src:url('file:///tmp/fonts/Pretendard-SemiBold.otf') format('opentype'); font-weight:600; }
    @font-face { font-family:'Pretendard'; src:url('file:///tmp/fonts/Pretendard-Bold.otf') format('opentype'); font-weight:700; }
    @font-face { font-family:'Pretendard'; src:url('file:///tmp/fonts/Pretendard-ExtraBold.otf') format('opentype'); font-weight:800; }

    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:1504px; height:741px; }
    body { font-family:'Pretendard', sans-serif; background:#FFFFFF; overflow:hidden; font-variant-numeric:tabular-nums; letter-spacing:-0.02em; }
    .canvas { width:1504px; height:741px; position:relative; }

    .brand { position:absolute; top:64px; left:96px; display:flex; align-items:center; gap:13px; }
    .brand .mark { width:42px; height:42px; }
    .brand .name { font-size:28px; font-weight:700; color:#6E9BD6; letter-spacing:-0.5px; }

    .head { position:absolute; top:188px; left:96px; width:780px; }
    .title { font-size:78px; font-weight:800; color:#1A1A1A; line-height:1.16; letter-spacing:-3px; }
    .title .hl { color:#6E9BD6; }
    .sub { margin-top:30px; font-size:30px; font-weight:500; color:#8A8A8E; letter-spacing:-0.5px; }

    .phone { position:absolute; right:96px; top:118px; width:432px; height:760px; background:#1A1A1A; border-radius:50px; padding:13px; box-shadow:0 34px 90px rgba(40,60,100,0.24); }
    .notch { position:absolute; top:22px; left:50%; transform:translateX(-50%); width:112px; height:28px; background:#1A1A1A; border-radius:15px; z-index:10; }
    .screen { width:100%; height:100%; background:#F5F5F4; border-radius:40px; overflow:hidden; display:flex; flex-direction:column; }

    .app-header { background:#FFFFFF; border-bottom:1px solid #EAEAEA; padding:46px 20px 14px; display:flex; align-items:center; justify-content:space-between; }
    .app-header .h1 { font-size:22px; font-weight:700; color:#1A1A1A; letter-spacing:-0.5px; }
    .app-header .actions { display:flex; gap:7px; }
    .app-header .btn { font-size:14px; font-weight:600; padding:8px 12px; }
    .app-header .ghost { color:#1A1A1A; border:1px solid #D4D4D4; background:#FFFFFF; }
    .app-header .primary { color:#FFFFFF; background:#1A1A1A; }

    .month-bar { background:#FFFFFF; border-bottom:1px solid #EAEAEA; padding:13px 20px; display:flex; align-items:center; justify-content:space-between; }
    .month-bar .label { font-size:20px; font-weight:600; color:#1A1A1A; }
    .month-bar .nav { font-size:22px; color:#8A8A8E; }
    .month-bar .today { font-size:14px; color:#1A1A1A; border:1px solid #D4D4D4; padding:5px 9px; }
    .month-bar .right { display:flex; align-items:center; gap:8px; }

    .weekdays { display:grid; grid-template-columns:repeat(7,1fr); background:#FFFFFF; border-bottom:1px solid #EAEAEA; }
    .weekdays > div { text-align:center; padding:10px 0; font-size:14px; color:#8A8A8E; font-weight:500; }
    .weekdays > div.sun { color:#F04452; }

    .grid { display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows:1fr; background:#EAEAEA; gap:1px; flex:1; }
    .cell { background:#FFFFFF; padding:7px 3px 0; display:flex; flex-direction:column; gap:3px; }
    .cell.out { background:#F5F5F4; }
    .num { font-size:13px; font-weight:500; color:#1A1A1A; }
    .cell.out .num { color:#B5B5B8; }
    .cell.sun .num { color:#F04452; }
    .num.today { align-self:flex-start; color:#FFFFFF; background:#1A1A1A; width:24px; height:24px; display:flex; align-items:center; justify-content:center; font-weight:600; }
    .pill { font-size:11px; line-height:1.3; padding:2px 5px; color:#FFFFFF; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .pill.blue { background:#A8C8EF; color:#1A1A1A; font-weight:600; }
    .pill.ink { background:#1A1A1A; }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="brand">
      <svg class="mark" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
        <g fill="#A8C8EF">
          <rect x="212" y="132" width="30" height="70" rx="15"/>
          <rect x="358" y="132" width="30" height="70" rx="15"/>
          <rect x="120" y="172" width="360" height="306" rx="60"/>
        </g>
        <rect x="120" y="244" width="360" height="13" fill="#FFFFFF"/>
        <path d="M300 270 V340 a34 34 0 1 0 0 68 V478" fill="none" stroke="#FFFFFF" stroke-width="17" stroke-linecap="round"/>
      </svg>
      <span class="name">Do &amp; Done</span>
    </div>

    <div class="head">
      <div class="title">한 일도, 할 일도<br>한 곳에서, <span class="hl">Do &amp; Done</span></div>
      <div class="sub">카테고리별 일정 관리 · 구글 없이 내 폰에 저장</div>
    </div>

    <div class="phone">
      <div class="notch"></div>
      <div class="screen">
        <div class="app-header">
          <div class="h1">Do &amp; Done</div>
          <div class="actions">
            <div class="btn ghost">백업</div>
            <div class="btn primary">추가</div>
          </div>
        </div>
        <div class="month-bar">
          <span class="nav">‹</span>
          <span class="label">2026년 6월</span>
          <span class="right"><span class="today">오늘</span><span class="nav">›</span></span>
        </div>
        <div class="weekdays">
          <div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
        </div>
        <div class="grid">
          <div class="cell sun"><span class="num">31</span></div>
          <div class="cell"><span class="num">1</span><span class="pill ink">팀 회의</span></div>
          <div class="cell"><span class="num">2</span></div>
          <div class="cell"><span class="num">3</span><span class="pill blue">운동</span></div>
          <div class="cell"><span class="num">4</span></div>
          <div class="cell"><span class="num">5</span><span class="pill ink">마감</span></div>
          <div class="cell"><span class="num">6</span></div>

          <div class="cell sun"><span class="num">7</span><span class="pill blue">브런치</span></div>
          <div class="cell"><span class="num">8</span></div>
          <div class="cell"><span class="num">9</span><span class="pill ink">리뷰</span></div>
          <div class="cell"><span class="num">10</span></div>
          <div class="cell"><span class="num">11</span><span class="pill blue">운동</span></div>
          <div class="cell"><span class="num">12</span></div>
          <div class="cell"><span class="num">13</span></div>

          <div class="cell sun"><span class="num">14</span></div>
          <div class="cell"><span class="num">15</span><span class="pill ink">출장</span></div>
          <div class="cell"><span class="num">16</span></div>
          <div class="cell"><span class="num today">17</span><span class="pill blue">약속</span></div>
          <div class="cell"><span class="num">18</span></div>
          <div class="cell"><span class="num">19</span></div>
          <div class="cell"><span class="num">20</span><span class="pill ink">정산</span></div>

          <div class="cell sun"><span class="num">21</span></div>
          <div class="cell"><span class="num">22</span></div>
          <div class="cell"><span class="num">23</span><span class="pill blue">운동</span></div>
          <div class="cell"><span class="num">24</span></div>
          <div class="cell"><span class="num">25</span><span class="pill ink">기념일</span></div>
          <div class="cell"><span class="num">26</span></div>
          <div class="cell"><span class="num">27</span></div>

          <div class="cell sun"><span class="num">28</span></div>
          <div class="cell"><span class="num">29</span></div>
          <div class="cell"><span class="num">30</span><span class="pill blue">회고</span></div>
          <div class="cell out"><span class="num">1</span></div>
          <div class="cell out"><span class="num">2</span></div>
          <div class="cell out"><span class="num">3</span></div>
          <div class="cell out"><span class="num">4</span></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
